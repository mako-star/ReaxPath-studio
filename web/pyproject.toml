[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "smiletosvg-web"
version = "0.1.0"
description = "FastAPI web frontend for reaxnet-lite - upload large ReaxFF bond trajectories and analyse them"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "mako-star"}]
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "reaxnet-lite>=0.1.0",
]

[project.optional-dependencies]
identifiers = ["rdkit>=2023.9"]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.setuptools.package-data]
"app.static" = ["*.html", "*.css", "*.js"]
